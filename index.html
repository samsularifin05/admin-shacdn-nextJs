<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Modern admin dashboard built with React, TypeScript, Tailwind CSS, and shadcn/ui. Features include user management, data tables, authentication, and responsive design."
    />
    <meta
      name="keywords"
      content="admin dashboard, react, typescript, tailwind css, shadcn ui, data table, authentication"
    />
    <meta name="author" content="Shadcn Admin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:title" content="Shadcn Admin - Modern Admin Dashboard" />
    <meta
      property="og:description"
      content="Modern admin dashboard built with React, TypeScript, Tailwind CSS, and shadcn/ui"
    />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourdomain.com/" />
    <meta
      property="twitter:title"
      content="Shadcn Admin - Modern Admin Dashboard"
    />
    <meta
      property="twitter:description"
      content="Modern admin dashboard built with React, TypeScript, Tailwind CSS, and shadcn/ui"
    />
    <meta
      property="twitter:image"
      content="https://yourdomain.com/og-image.png"
    />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Shadcn Admin - Modern Admin Dashboard</title>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Shadcn Admin",
        "description": "Modern admin dashboard built with React, TypeScript, and Tailwind CSS",
        "url": "https://yourdomain.com",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
